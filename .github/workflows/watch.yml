name: post-watcher
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: watcher
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp curl_cffi
      - name: check every 3 minutes for ~5h45m
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_CONFIG: ${{ secrets.WATCH_CONFIG }}
          LOOPS: ${{ github.event_name == 'schedule' && '1' || '115' }}
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          for i in $(seq 1 $LOOPS); do
            python watch.py || echo "check failed, retrying next loop"
            git add seen.json
            git diff --cached --quiet || (git commit -qm "update seen posts" && git pull -q --rebase && git push -q) || true
            if [ "$i" -lt "$LOOPS" ]; then sleep 180; fi
          done
      - name: start the next run (keeps it going 24/7)
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --repo ${{ github.repository }}
